name: aliplayer_widget
description: A high-performance video playback component specifically designed for Flutter applications, built on top of the AliCloud Player SDK `flutter_aliplayer`.

# NOTE: Please synchronize and modify the version number here:
# static const String kWidgetVersion = 'x.y.z';
version: 7.11.0-interactive
repository: https://github.com/aliyun/player_widget
issue_tracker: https://github.com/aliyun/player_widget/issues
homepage: https://aliyun.github.io/player_widget/
topics:
  - player
  - video
  - video-player
  - aliyun
  - short-drama

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  # The following adds the flutter aliplayer package
  # `aliplayer_widget` already depends on `flutter_aliplayer` internally.
  # Only declare `flutter_aliplayer` explicitly when you need direct access to low-level APIs.
  # Advanced API usage: MediaLoader preloading, etc.
  # ⚠️ SDK 版本兼容说明：
  # 当前 flutter_livepush_plugin 基于 AliVCSDK_InteractiveLive（一体化 SDK）构建。
  # flutter_aliplayer 播放插件如需与 flutter_livepush_plugin 在同一项目中使用，
  # 必须使用对应的一体化 SDK 特殊版本，例如：7.11.0-interactivelive。
  #
  # 请务必通过完整版本号写死版本，避免使用范围版本或不明确的版本配置。
  # 否则依赖解析时可能会路由到最新版本或播放器独立 SDK 版本，
  # 导致 flutter_aliplayer 与 flutter_livepush_plugin 引入的底层 AliVCSDK 不一致。
  #
  # 一旦同一工程中同时存在一体化 SDK 与播放器独立 SDK，
  # 可能出现重复符号、类/方法冲突、依赖冲突等编译异常，
  # 也可能导致运行时错误或播放、推流功能不可用。
  flutter_aliplayer: "7.11.0-interactivelive"
  #  flutter_aliplayer:
  #    path: ../../FlutterSDK/flutter_aliplayer

  # Allows to keep the device screen awake, i.e. prevent the screen from sleeping.
  wakelock_plus: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    # 图标资源（自动包含子目录 2.0x/、3.0x/ 作为分辨率变体）
    - assets/icons/

  #
  # For details regarding assets in packages, see
  # https://flutter.dev/assets-and-images/#from-packages
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/custom-fonts/#from-packages
