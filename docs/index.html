<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>AliPlayerWidget - Flutter 播放器组件</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="description" content="AliPlayerWidget Flutter 播放器组件文档 - 低代码播放器 UI 组件与场景化解决方案">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@latest/lib/themes/vue.css">
    <style>
        :root {
            --theme-color: #42b983;
            --theme-color-dark: #3aa876;
        }

        /* 暗黑模式 */
        body.dark-mode {
            background: #1a1a1a;
            color: #e0e0e0;
        }
        body.dark-mode .sidebar {
            background: #202020;
        }
        body.dark-mode .sidebar > h1 a {
            color: #fff;
        }
        body.dark-mode .sidebar-nav > ul > li > p {
            color: #bbb;
        }
        body.dark-mode .sidebar-nav li a {
            color: #999;
        }
        body.dark-mode .sidebar-nav li a:hover {
            color: #42b983;
        }
        body.dark-mode .sidebar-nav li.active > a {
            color: #42b983;
            border-right-color: #42b983;
        }

        /* 标题 - 强制白色 */
        body.dark-mode .markdown-section h1,
        body.dark-mode .markdown-section h2,
        body.dark-mode .markdown-section h3,
        body.dark-mode .markdown-section h4,
        body.dark-mode .markdown-section h5,
        body.dark-mode .markdown-section h6 {
            color: #ffffff !important;
        }

        body.dark-mode .markdown-section a {
            color: #5ecaa3;
        }
        body.dark-mode pre {
            background: #282c34 !important;
        }
        body.dark-mode pre code {
            color: #e0e0e0 !important;
            background: transparent !important;
            text-shadow: none !important;
        }
        /* 代码高亮关键字 */
        body.dark-mode .token.keyword,
        body.dark-mode .token.tag,
        body.dark-mode .token.selector,
        body.dark-mode .token.attr-name {
            color: #c678dd !important;
        }
        body.dark-mode .token.string,
        body.dark-mode .token.attr-value {
            color: #98c379 !important;
        }
        body.dark-mode .token.function {
            color: #61afef !important;
        }
        body.dark-mode .token.number,
        body.dark-mode .token.constant {
            color: #d19a66 !important;
        }
        body.dark-mode .token.comment {
            color: #5c6370 !important;
        }

        body.dark-mode .markdown-section code {
            background: rgba(66, 185, 131, 0.2);
            color: #5ecaa3 !important;
            text-shadow: none !important;
        }
        body.dark-mode blockquote {
            background: #252525;
            border-left-color: #42b983;
            color: #aaa;
        }
        body.dark-mode table th {
            background: #252525;
            color: #fff;
        }
        body.dark-mode table tr:nth-child(2n) {
            background: #222;
        }
        body.dark-mode table td,
        body.dark-mode table th {
            border-color: #333;
        }
        body.dark-mode .mermaid {
            filter: invert(1) hue-rotate(180deg);
        }
        body.dark-mode .docsify-pagination-container {
            border-top-color: #333;
        }
        body.dark-mode .pagination-item-label {
            color: #888;
        }
        body.dark-mode .pagination-item-label-title {
            color: #42b983;
        }

        /* 侧边栏开关按钮（暗黑模式 / 语言切换） */
        .sidebar-toggle-btn {
            cursor: pointer;
            display: block;
            text-align: center;
            padding: 10px 0;
            margin: 0 15px 10px 15px;
            font-weight: bold;
            font-size: 14px;
            border-radius: 4px;
            background-color: rgba(66, 185, 131, 0.1);
            color: #42b983;
            border: 1px solid #42b983;
            transition: all 0.3s;
        }
        body.dark-mode .sidebar-toggle-btn {
            background-color: rgba(66, 185, 131, 0.15);
            color: #5ecaa3;
            border: 1px solid #3aa876;
        }
        .sidebar-toggle-btn:hover {
            background-color: var(--theme-color);
            color: #fff;
        }
    </style>
</head>

<body>
    <div id="app">加载中...</div>
    <script>
        // 初始化暗黑模式（防止页面闪烁）
        if (localStorage.getItem('theme-mode') === 'dark') {
            document.body.classList.add('dark-mode');
        }

        window.$docsify = {
            name: 'AliPlayerWidget',
            nameLink: '#/',
            repo: '',
            loadSidebar: true,
            auto2top: true,
            subMaxLevel: 3,
            pagination: {
                previousText: '上一章节',
                nextText: '下一章节',
            },
            count: {
                countable: true,
                fontsize: '0.9em',
                color: 'rgb(90,90,90)',
                language: 'chinese'
            },
            search: {
                maxAge: 86400000,
                paths: 'auto',
                placeholder: '搜索',
                noData: '没有结果',
                depth: 6
            },
            plugins: [
                // 暗黑模式开关插件
                function(hook, vm) {
                    hook.doneEach(function() {
                        const sidebar = document.querySelector('.sidebar-nav');
                        if (!sidebar || document.querySelector('.sidebar-toggle-btn-theme')) return;

                        const btn = document.createElement('div');
                        btn.className = 'sidebar-toggle-btn sidebar-toggle-btn-theme';

                        const savedTheme = localStorage.getItem('theme-mode');
                        if (savedTheme === 'dark') {
                            document.body.classList.add('dark-mode');
                            btn.textContent = '🌙 切换亮色';
                        } else {
                            btn.textContent = '☀️ 切换暗色';
                        }

                        btn.onclick = function() {
                            document.body.classList.toggle('dark-mode');
                            const isDark = document.body.classList.contains('dark-mode');
                            localStorage.setItem('theme-mode', isDark ? 'dark' : 'light');
                            btn.textContent = isDark ? '🌙 切换亮色' : '☀️ 切换暗色';
                        };

                        sidebar.insertBefore(btn, sidebar.firstChild);
                    });
                },
                // 中英文切换插件（含侧边栏动态加载）
                function(hook, vm) {
                    function getCurrentPath() {
                        return window.location.hash.replace(/^#\//, '') || '';
                    }
                    // 中文首页路径：'./'、''、'/'、'README'、'README.md' 等
                    function isChineseHome(path) {
                        return path === '' || path === './' || path === '/' ||
                            /^\.?\/?README(\.md)?$/i.test(path);
                    }
                    // 英文首页路径：README-EN(.md) 及异常生成的 ./-en 等
                    function isEnglishHome(path) {
                        return /^\.?\/?README-EN(\.md)?$/i.test(path) ||
                            /^\.?\/?-en$/i.test(path);
                    }
                    function isEnglishPath(path) {
                        return isEnglishHome(path) || /-en(\.md)?$/i.test(path);
                    }
                    function switchLang() {
                        const currentPath = getCurrentPath();
                        let newPath;
                        if (isEnglishHome(currentPath)) {
                            // 英文首页 → 中文首页
                            newPath = './';
                        } else if (isChineseHome(currentPath)) {
                            // 中文首页 → 英文首页（README 使用大写 -EN.md 后缀）
                            newPath = 'README-EN.md';
                        } else if (isEnglishPath(currentPath)) {
                            // 其他英文页 → 中文：兼容大小写后缀（-EN.md / -en.md / -en）
                            newPath = currentPath.replace(/-en(\.md)?$/i, '$1');
                        } else if (currentPath.endsWith('.md')) {
                            // 其他中文页 → 英文：使用小写 -en.md 后缀
                            newPath = currentPath.slice(0, -3) + '-en.md';
                        } else {
                            newPath = currentPath + '-en';
                        }
                        window.location.hash = '#/' + newPath;
                    }
                    // 动态加载对应语言的侧边栏
                    function loadSidebar(isEnglish) {
                        const sidebarFile = isEnglish ? '_sidebar-EN.md' : '_sidebar.md';
                        fetch(sidebarFile).then(function(res) {
                            return res.text();
                        }).then(function(md) {
                            const sidebarNav = document.querySelector('.sidebar-nav');
                            if (!sidebarNav) return;
                            // 保留顶部按钮
                            const themeBtn = document.querySelector('.sidebar-toggle-btn-theme');
                            const langBtn = document.querySelector('.sidebar-toggle-btn-lang');
                            // 用 docsify 的 compiler 解析 markdown
                            const html = vm.compiler ? vm.compiler.sidebar(md) : marked(md);
                            sidebarNav.innerHTML = html;
                            // 重新插入按钮（暗黑模式在最上面，语言切换在其下面）
                            if (langBtn) sidebarNav.insertBefore(langBtn, sidebarNav.firstChild);
                            if (themeBtn) sidebarNav.insertBefore(themeBtn, sidebarNav.firstChild);
                            // 高亮当前页面
                            highlightActive();
                        });
                    }
                    // 高亮当前活动链接
                    function highlightActive() {
                        const currentPath = getCurrentPath();
                        const links = document.querySelectorAll('.sidebar-nav a');
                        links.forEach(function(link) {
                            const href = link.getAttribute('href') || '';
                            const linkPath = href.replace(/^#\//, '').replace(/^\.\//,'');
                            link.parentElement.classList.remove('active');
                            if (linkPath && currentPath.includes(linkPath.replace('./', ''))) {
                                link.parentElement.classList.add('active');
                            }
                        });
                    }
                    hook.doneEach(function() {
                        const sidebar = document.querySelector('.sidebar-nav');
                        if (!sidebar) return;

                        // 创建语言切换按钮
                        let langBtn = document.querySelector('.sidebar-toggle-btn-lang');
                        if (!langBtn) {
                            langBtn = document.createElement('div');
                            langBtn.className = 'sidebar-toggle-btn sidebar-toggle-btn-lang';
                            langBtn.onclick = switchLang;
                            // 插入到暗黑模式按钮之后
                            const themeBtn = document.querySelector('.sidebar-toggle-btn-theme');
                            if (themeBtn && themeBtn.nextSibling) {
                                sidebar.insertBefore(langBtn, themeBtn.nextSibling);
                            } else {
                                sidebar.insertBefore(langBtn, sidebar.firstChild);
                            }
                        }
                        // 更新按钮文本
                        const path = getCurrentPath();
                        const isEnglish = isEnglishPath(path);
                        langBtn.textContent = isEnglish ? '🌐 中文' : '🌐 English';
                        // 加载对应语言的侧边栏
                        loadSidebar(isEnglish);
                    });
                }
            ]
        };
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify@latest/lib/docsify.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-mermaid@latest/dist/docsify-mermaid.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@latest/components/prism-bash.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@latest/components/prism-dart.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@latest/components/prism-yaml.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-pagination@latest/dist/docsify-pagination.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-copy-code"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/external-script.min.js"></script>
    <script src="//unpkg.com/docsify-count/dist/countable.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>

</html>
